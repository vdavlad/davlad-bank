<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Davlad Bank — Contact</title>

  <style>
    :root{
      --bg:#070707;
      --card:#121212;
      --text:#EAEAEA;
      --muted:#8A8A8A;
      --accent:#C6A85B;
      --border:rgba(255,255,255,0.08);
    }

    body{
      margin:0;
      font-family:Arial;
      background:var(--bg);
      color:var(--text);
    }

    .container{
      max-width:800px;
      margin:auto;
      padding:60px 20px;
      text-align:center;
    }

    h1{
      font-size:40px;
      margin-bottom:10px;
    }

    .subtitle{
      color:var(--muted);
      margin-bottom:40px;
    }

    .card{
      padding:30px;
      border-radius:16px;
      border:1px solid var(--border);
      background:var(--card);
    }

    .item{
      margin-bottom:18px;
      color:var(--muted);
    }

    .item strong{
      color:var(--text);
    }

    .note{
      margin-top:30px;
      font-size:13px;
      color:#777;
    }
  </style>
</head>
<body>

<div class="container">

  <h1>Contact</h1>
  <div class="subtitle">Strategic communication channels</div>

  <div class="card">

    <div class="item">
      <strong>Email:</strong> contact@davladbank.com
    </div>

    <div class="item">
      <strong>Response time:</strong> depends on liquidity conditions
    </div>

    <div class="item">
      <strong>Priority:</strong> investors > everyone else
    </div>

    <div class="note">
      For strategic investors, additional contact channels may be disclosed upon request.
    </div>

  </div>

</div>

</body>
</html>
