<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Davlad Bank</title>

  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">

<style>
:root{
  --bg:#080808;
  --card:#151515;
  --card-2:#1c1c1c;
  --border:rgba(255,215,80,0.15);
  --gold:#f3c54d;
  --gold-soft:#ffdf8c;
  --text:#f7f7f7;
  --muted:#bdbdbd;
}

body.light{
  --bg:#f6f2e8;
  --card:#fffdf8;
  --card-2:#f2eadc;
  --border:rgba(166,124,0,0.14);
  --gold:#c79b2b;
  --gold-soft:#9f760a;
  --text:#111;
  --muted:#666;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* FX BAR */
.fx-bar{
  display:flex;
  justify-content:space-between;
  padding:6px 20px;
  font-size:13px;
  border-bottom:1px solid var(--border);
}
.fx-bar span{ color:var(--gold-soft); }

/* NAV */
.nav{
  display:flex;
  justify-content:space-between;
  padding:16px 20px;
}
.nav a{
  margin-right:14px;
  text-decoration:none;
  color:var(--text);
  font-weight:600;
}

/* BANNER */
.banner{
  height:420px;
  background:url("images/banner_v1.jpg") center/cover;
  display:flex;
  align-items:flex-end;
  padding:30px;
}
.banner h1{ font-size:52px; margin:0; }
.banner p{ color:var(--gold-soft); }

/* SERVICES */
.services{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
  padding:20px;
}
.service{
  background:var(--card-2);
  border:1px solid var(--border);
  padding:20px;
  text-align:center;
  border-radius:12px;
  transition:.2s;
}
.service:hover{ transform:translateY(-3px); }

/* CARDS */
.section{
  padding:20px;
}
.card{
  background:var(--card);
  padding:20px;
  border-radius:14px;
  border:1px solid var(--border);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

@media(max-width:900px){
  .services{ grid-template-columns:1fr 1fr; }
  .grid{ grid-template-columns:1fr 1fr; }
}
</style>
</head>

<body>

<!-- FX BAR -->
<div class="fx-bar">
  <div>
    EUR/USD <span id="usd">—</span> |
    EUR/GBP <span id="gbp">—</span> |
    EUR/CHF <span id="chf">—</span>
  </div>
  <div id="date">Loading...</div>
</div>

<!-- NAV -->
<div class="nav">
  <div><b>Davlad Bank</b></div>
  <div>
    <a href="#">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="#">Funding</a>
    <a href="#">Investors</a>
    <a href="#">Contact</a>
  </div>
</div>

<!-- BANNER -->
<div class="banner">
  <div>
    <h1>Welcome</h1>
    <p>In liquidity we trust.</p>
  </div>
</div>

<!-- SERVICES -->
<div class="services">

<div class="service">
<svg width="28" height="28" stroke="currentColor" fill="none">
<path d="M4 20h16M6 16V10M10 16V6M14 16V12M18 16V8"/>
</svg>
<br>Liquidity
</div>

<div class="service">
<svg width="28" height="28" stroke="currentColor" fill="none">
<circle cx="12" cy="12" r="8"/>
<path d="M8 12h8"/>
</svg>
<br>Funding
</div>

<div class="service">
<svg width="28" height="28" stroke="currentColor" fill="none">
<path d="M4 20l6-6 4 4 6-10"/>
</svg>
<br>Advisory
</div>

<div class="service">
<svg width="28" height="28" stroke="currentColor" fill="none">
<circle cx="12" cy="12" r="10"/>
</svg>
<br>Markets
</div>

<div class="service">
<svg width="28" height="28" stroke="currentColor" fill="none">
<path d="M4 20h16M8 16l4-4 4 4"/>
</svg>
<br>Investors
</div>

</div>

<!-- MARKET SNAPSHOT -->
<div class="section">
<div class="card">
<h2>Market Snapshot</h2>

<div class="grid">
<div>DAX <br><b id="dax">—</b></div>
<div>S&P 500 <br><b id="sp">—</b></div>
<div>EUR/USD <br><b id="usd2">—</b></div>
<div>EUR/CHF <br><b id="chf2">—</b></div>
</div>

</div>
</div>

<!-- FX BLOCK -->
<div class="section">
<div class="card">
<h2>Exchange Rates</h2>

<div class="grid">
<div>EUR/USD <br><b id="usd3">—</b></div>
<div>EUR/GBP <br><b id="gbp3">—</b></div>
<div>EUR/CHF <br><b id="chf3">—</b></div>
</div>

</div>
</div>

<script>
async function loadFX(){
  const res = await fetch("https://api.frankfurter.dev/v1/latest?base=EUR&symbols=USD,GBP,CHF");
  const data = await res.json();

  usd.textContent = usd2.textContent = usd3.textContent = data.rates.USD.toFixed(4);
  gbp.textContent = gbp3.textContent = data.rates.GBP.toFixed(4);
  chf.textContent = chf2.textContent = chf3.textContent = data.rates.CHF.toFixed(4);

  date.textContent = "Updated: " + data.date;

  dax.textContent = "18,965";
  sp.textContent = "5,430";
}
loadFX();
</script>

</body>
</html>
