<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Davlad Hero Comparison</title>

<style>
:root{
  --bg:#050505;
  --text:#f5f5f5;
  --muted:#b8b8b8;
  --accent:#c6a85b;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* SECTION */
.section{
  border-bottom:1px solid rgba(255,255,255,0.08);
}

/* BANNER */
.banner{
  position:relative;
  min-height:500px;
  display:flex;
  align-items:center;
  padding:60px;
  overflow:hidden;
}

.banner::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.2), rgba(0,0,0,0.7)),
    url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=1600") center/cover;
}

/* CONTENT */
.banner-overlay{
  position:relative;
  z-index:2;
  max-width:700px;
}

/* BIG TEXT */
.banner-bg-text{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:200px;
  font-weight:900;
  letter-spacing:6px;
  opacity:0.08;
  pointer-events:none;
  user-select:none;
  white-space:nowrap;
}

/* TEXT */
.banner-kicker{
  font-size:13px;
  letter-spacing:1.6px;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:10px;
}

.banner-title{
  font-size:56px;
  font-weight:800;
  margin:0 0 10px;
}

.banner-subtitle{
  font-size:18px;
  color:var(--muted);
}

/* LABEL */
.label{
  position:absolute;
  top:20px;
  right:20px;
  background:rgba(255,255,255,0.05);
  padding:6px 12px;
  border-radius:10px;
  font-size:12px;
  z-index:3;
}

/* MOBILE */
@media(max-width:768px){
  .banner{
    padding:40px 20px;
  }
  .banner-bg-text{
    font-size:90px;
  }
  .banner-title{
    font-size:36px;
  }
}
.card{
  width:380px;
  height:220px;
  border-radius:20px;
  background:linear-gradient(145deg,#0a0a0a,#050505);
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  position:relative;
  padding:20px;
}
  .card{
  transform: rotate(-90deg) scale(0.75);
}

/* CHIP */
.chip{
  width:50px;
  height:35px;
  background:linear-gradient(145deg,#bbb,#777);
  border-radius:6px;
}

/* LOGO */
.logo{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:80px;
}

/* MASTERCARD */
.mastercard{
  position:absolute;
  bottom:20px;
  right:20px;
  width:50px;
  height:30px;
}

.mastercard::before,
.mastercard::after{
  content:"";
  position:absolute;
  width:30px;
  height:30px;
  border-radius:50%;
}

.mastercard::before{
  background:#EB001B;
  left:0;
}

.mastercard::after{
  background:#F79E1B;
  right:0;
  opacity:0.9;
}
  
</style>
</head>
<body>

<section class="section">
  <div class="banner">
    <div class="label">VERSION 1 — PREMIUM</div>

   <div class="banner-overlay">
    <div class="banner-bg-text" id="bannerBgText">FOUNDATION</div>

    <div class="banner-kicker" id="bannerKicker">PRIVATE BANKING</div>
    <h1 class="banner-title" id="bannerTitle">Davlad Bank</h1>
    <div class="banner-subtitle" id="bannerSubtitle">In liquidity we trust.</div>
    <div class="banner-text" id="bannerText">
      Davlad Bank provides a focused range of financial products across deposits, investments, and lending solutions.
    </div>
  </div>
  </div>
  <div class="card">
  
  <div class="chip"></div>

  <div class="logo">
    <!-- ТВОЙ SVG -->
    <svg viewBox="0 0 64 64">
      <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="#0B0B0B" stroke="#1F1F1F" stroke-width="1"/>
      
      <path d="M22 14H34.5C44.8 14 51 21.1 51 32C51 42.9 44.8 50 34.5 50H22V14Z"
            fill="none"
            stroke="#F2F2F2"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"/>

      <line x1="16" y1="25.5" x2="41" y2="25.5"
            stroke="#B89A4A"
            stroke-width="2"
            stroke-linecap="round"/>

      <line x1="16" y1="38.5" x2="41" y2="38.5"
            stroke="#B89A4A"
            stroke-width="2"
            stroke-linecap="round"/>
    </svg>
  </div>

  <div class="mastercard"></div>

</div>
</section>

</body>
</html>
